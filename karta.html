<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="page-header map-header">
    <div class="hero-content">
        <span class="eyebrow">Interaktivna karta</span>
        <h1>Karta putovanja</h1>
        <p>Sve destinacije i avanture prikazane su na jednoj karti.</p>
    </div>
</header>

<nav class="meni">
    <a href="index.html">Početna</a>
    <a href="destinacije.html">Destinacije</a>
    <a href="avanture.html">Avanture</a>
    <a href="karta.html">Karta</a>
    <a href="kontakt.html">Kontakt</a>
</nav>

<main class="map-page">
    <section class="intro">
        <span class="eyebrow">Lokacije</span>
        <h2>Pregled svih mjesta</h2>
        <p>Klikni na oznaku na karti za naziv lokacije.</p>
    </section>

    <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const locations = [
    { lat: 48.8584, lng: 2.2945, name: 'Pariz, Francuska' },
    { lat: 41.8902, lng: 12.4922, name: 'Rim, Italija' },
    { lat: 41.3851, lng: 2.1734, name: 'Barcelona, Španjolska' },
    { lat: 52.3676, lng: 4.9041, name: 'Amsterdam, Nizozemska' },
    { lat: 51.5007, lng: -0.1246, name: 'London, Engleska' },
    { lat: 45.9763, lng: 7.6586, name: 'Alpe' },
    { lat: 4.1755, lng: 73.5093, name: 'Maldivi' },
    { lat: -1.4061, lng: 35.0086, name: 'Safari Afrika' },
    { lat: -45.0220, lng: 168.7770, name: 'Bungee Jumping' },
    { lat: 47.5615, lng: 13.6495, name: 'Kampiranje' },
    { lat: 24.8667, lng: 55.3860, name: 'Dubai' },
    { lat: 62.1049, lng: 7.2057, name: 'Norveška' },
    { lat: 64.3136, lng: -20.3024, name: 'Island' },
    { lat: 9.3927, lng: -84.1400, name: 'Tropska džungla' },
    { lat: -44.8710, lng: 167.9090, name: 'Novi Zeland' }
];

const map = L.map('map').setView([25, 10], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

locations.forEach(location => {
    L.marker([location.lat, location.lng]).addTo(map).bindPopup(`<b>${location.name}</b>`);
});
</script>

<footer>
    <p>© 2026 Avanturistička Putovanja</p>
</footer>

</body>
</html>
