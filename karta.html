<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Karta putovanja</h1>
    <p>Lokacije destinacija i avantura.</p>
</header>

<nav>
    <a href="index.html">Početna</a>
    <a href="destinacije.html">Destinacije</a>
    <a href="avanture.html">Avanture</a>
    <a href="karta.html">Karta</a>
    <a href="kontakt.html">Kontakt</a>
</nav>

<main>
    <div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const mjesta = [
    [48.8584, 2.2945, 'Pariz'], [41.8902, 12.4922, 'Rim'],
    [41.3851, 2.1734, 'Barcelona'], [52.3676, 4.9041, 'Amsterdam'],
    [51.5007, -0.1246, 'London'], [45.9763, 7.6586, 'Alpe'],
    [4.1755, 73.5093, 'Maldivi'], [-1.4061, 35.0086, 'Safari Afrika'],
    [-45.0220, 168.7770, 'Bungee Jumping'], [47.5615, 13.6495, 'Kampiranje'],
    [24.8667, 55.3860, 'Dubai'], [62.1049, 7.2057, 'Norveška'],
    [64.3136, -20.3024, 'Island'], [9.3927, -84.1400, 'Tropska džungla'],
    [-44.8710, 167.9090, 'Novi Zeland']
];

const map = L.map('map').setView([25, 10], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
mjesta.forEach(m => L.marker([m[0], m[1]]).addTo(map).bindPopup(m[2]));
</script>

<footer>
    <p>© 2026 Avanturistička Putovanja</p>
</footer>

</body>
</html>
